name: PeopleBot website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'First run: import. Later: deploy.'
        required: true
        default: import
        type: choice
        options: [import, deploy]

permissions:
  contents: read

concurrency:
  group: peoplebot-website
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'import' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Import current public files over FTPS
        env:
          PEOPLEBOT_FTP_PASSWORD: ${{ secrets.PEOPLEBOT_FTP_PASSWORD }}
        run: python3 scripts/peoplebot_website.py import
      - name: Save imported website to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- website/
          git commit -m 'Import current peoplebot.me website through restricted FTPS'
          git push origin HEAD:main
          echo 'Current site imported. Run this workflow with mode deploy to test publishing.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.mode == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Publish and verify website over FTPS
        env:
          PEOPLEBOT_FTP_PASSWORD: ${{ secrets.PEOPLEBOT_FTP_PASSWORD }}
        run: python3 scripts/peoplebot_website.py deploy
